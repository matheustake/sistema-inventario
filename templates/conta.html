{% extends "base.html" %}
{% block titulo %}Minha conta{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <div><h1>Minha conta</h1>
    <p>{{ usuario.nome or usuario.email }} · {{ usuario.email }} ·
      <span class="perfil-tag perfil-{{ usuario.perfil }}">{{ usuario.perfil | perfil }}</span></p></div>
</div>
<form class="card" method="post" style="max-width:460px">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <h2>Trocar senha</h2>
  <div class="campo"><label for="atual">Senha atual</label>
    <input type="password" id="atual" name="atual" required autocomplete="current-password"></div>
  <div class="campo"><label for="nova">Nova senha (mínimo {{ senha_minima }} caracteres)</label>
    <input type="password" id="nova" name="nova" required minlength="{{ senha_minima }}" autocomplete="new-password"></div>
  <div class="campo"><label for="confirmacao">Repita a nova senha</label>
    <input type="password" id="confirmacao" name="confirmacao" required minlength="{{ senha_minima }}" autocomplete="new-password"></div>
  <button class="btn" type="submit">Salvar nova senha</button>
</form>
{% endblock %}
